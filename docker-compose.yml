services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerline} -d ${POSTGRES_DB:-ledgerline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ledgerline-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ledgerline}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided and at least 32 characters}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be provided and at least 32 characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
    command: sh -c "npx prisma migrate deploy && node apps/api/dist/main.js"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ledgerline-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side Next.js proxy destination inside Docker network:
      API_URL: http://api:4000
      # Keep NEXT_PUBLIC_API_URL empty so browser connects via same-origin relative URL (/api/v1)
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
