services:
  - type: web
    name: ledgerline-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run prisma:generate --workspace apps/api && npm run build --workspace apps/api
    startCommand: npm run prisma:deploy --workspace apps/api && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
