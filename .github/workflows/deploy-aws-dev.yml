name: Deploy to AWS DEV

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test suite prior to deployment'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'infrastructure/**'
      - 'Dockerfile.api'
      - '.github/workflows/deploy-aws-dev.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test-and-verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: blynt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/blynt_test?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/blynt_test?schema=public
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_random_1
      SESSION_SECRET: ci_test_session_secret_must_be_at_least_32_characters_random_2
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace apps/api

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Deploy Migrations & Seed
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Run E2E Tests
        run: npm run test:e2e

  deploy-aws-dev:
    name: Build & Deploy API to AWS Dev
    runs-on: ubuntu-latest
    needs: [test-and-verify]
    if: always() && (needs.test-and-verify.result == 'success' || inputs.skip_tests == true)

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: blynt-dev-api
      APP_RUNNER_SERVICE_NAME: blynt-dev-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image to ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger App Runner Deployment
        run: |
          echo "[+] Fetching App Runner service ARN for ${APP_RUNNER_SERVICE_NAME}..."
          SERVICE_ARN=$(aws apprunner list-services --region ${AWS_REGION} \
            --query "ServiceSummaryList[?ServiceName=='${APP_RUNNER_SERVICE_NAME}'].ServiceArn" \
            --output text)

          if [ -n "${SERVICE_ARN}" ] && [ "${SERVICE_ARN}" != "None" ]; then
            echo "[+] Found App Runner service: ${SERVICE_ARN}"
            echo "[+] Starting deployment..."
            OPERATION_ID=$(aws apprunner start-deployment \
              --service-arn "${SERVICE_ARN}" \
              --region ${AWS_REGION} \
              --query "OperationId" \
              --output text)
            echo "[+] Started App Runner deployment operation: ${OPERATION_ID}"
          else
            echo "[!] App Runner service '${APP_RUNNER_SERVICE_NAME}' not found. Verify Terraform deployment has run."
          fi
