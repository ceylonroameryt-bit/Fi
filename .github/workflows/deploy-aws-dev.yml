name: Deploy to AWS DEV

on:
  workflow_dispatch:
    inputs:
      run_terraform:
        description: 'Provision / Update AWS Infrastructure (Terraform)'
        required: false
        default: true
        type: boolean
      skip_tests:
        description: 'Skip test suite prior to deployment'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'infrastructure/**'
      - 'Dockerfile.*'
      - '.github/workflows/deploy-aws-dev.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test-and-verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: blynt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/blynt_test?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/blynt_test?schema=public
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_random_1
      SESSION_SECRET: ci_test_session_secret_must_be_at_least_32_characters_random_2
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace apps/api

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

  deploy-aws-dev:
    name: Provision & Deploy to AWS Dev
    runs-on: ubuntu-latest
    needs: [test-and-verify]
    if: always() && (needs.test-and-verify.result == 'success' || inputs.skip_tests == true || github.event_name == 'push')

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: blynt-dev-api
      WEB_ECR_REPOSITORY: blynt-dev-web
      APP_RUNNER_SERVICE_NAME: blynt-dev-api
      WEB_APP_RUNNER_SERVICE_NAME: blynt-dev-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Keys or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Account Identity
        run: |
          echo "[+] Connected to AWS Account:"
          aws sts get-caller-identity

      - name: Ensure ECR Repositories Exist
        run: |
          echo "[+] Checking Amazon ECR repositories..."
          aws ecr describe-repositories --repository-names ${ECR_REPOSITORY} --region ${AWS_REGION} || \
          aws ecr create-repository --repository-name ${ECR_REPOSITORY} --region ${AWS_REGION} --image-scanning-configuration scanOnPush=true

          aws ecr describe-repositories --repository-names ${WEB_ECR_REPOSITORY} --region ${AWS_REGION} || \
          aws ecr create-repository --repository-name ${WEB_ECR_REPOSITORY} --region ${AWS_REGION} --image-scanning-configuration scanOnPush=true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Docker image to ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Frontend Docker image to ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.WEB_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.WEB_ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        if: ${{ github.event_name == 'push' || inputs.run_terraform != false }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Provision Infrastructure via Terraform
        if: ${{ github.event_name == 'push' || inputs.run_terraform != false }}
        working-directory: ./infrastructure/environments/dev
        run: |
          echo "[+] Initializing Terraform..."
          terraform init
          echo "[+] Adopting ECR repositories into Terraform state..."
          terraform import module.ecr.aws_ecr_repository.api blynt-dev-api || true
          terraform import module.ecr.aws_ecr_repository.web blynt-dev-web || true
          echo "[+] Applying Terraform infrastructure in ${AWS_REGION}..."
          terraform apply -auto-approve

      - name: Deploy & Verify App Runner Services
        run: |
          echo "[+] Checking API App Runner Service..."
          API_ARN=$(aws apprunner list-services --region ${AWS_REGION} \
            --query "ServiceSummaryList[?ServiceName=='${APP_RUNNER_SERVICE_NAME}'].ServiceArn" \
            --output text)

          if [ -n "${API_ARN}" ] && [ "${API_ARN}" != "None" ]; then
            API_STATUS=$(aws apprunner describe-service --service-arn "${API_ARN}" --region ${AWS_REGION} --query "Service.Status" --output text)
            echo "[+] API Service status: ${API_STATUS}"
            if [ "${API_STATUS}" = "RUNNING" ]; then
              aws apprunner start-deployment --service-arn "${API_ARN}" --region ${AWS_REGION} || true
            fi
            API_URL=$(aws apprunner describe-service --service-arn "${API_ARN}" --region ${AWS_REGION} --query "Service.ServiceUrl" --output text)
            echo "::notice title=AWS API Live::API URL: https://${API_URL}"
          fi

          echo "[+] Checking Web Frontend App Runner Service..."
          WEB_ARN=$(aws apprunner list-services --region ${AWS_REGION} \
            --query "ServiceSummaryList[?ServiceName=='${WEB_APP_RUNNER_SERVICE_NAME}'].ServiceArn" \
            --output text)

          if [ -n "${WEB_ARN}" ] && [ "${WEB_ARN}" != "None" ]; then
            WEB_STATUS=$(aws apprunner describe-service --service-arn "${WEB_ARN}" --region ${AWS_REGION} --query "Service.Status" --output text)
            echo "[+] Web Service status: ${WEB_STATUS}"
            if [ "${WEB_STATUS}" = "RUNNING" ]; then
              aws apprunner start-deployment --service-arn "${WEB_ARN}" --region ${AWS_REGION} || true
            fi
            WEB_URL=$(aws apprunner describe-service --service-arn "${WEB_ARN}" --region ${AWS_REGION} --query "Service.ServiceUrl" --output text)
            echo "::notice title=AWS Web App Live::Web App URL: https://${WEB_URL}"
          fi
