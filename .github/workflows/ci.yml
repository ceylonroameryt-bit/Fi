name: CI Pipeline

on:
  push:
    branches: [ "main", "harden/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: blynt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/blynt_test?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/blynt_test?schema=public
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_random_1
      SESSION_SECRET: ci_test_session_secret_must_be_at_least_32_characters_random_2
      FRONTEND_URL: http://localhost:3000
      MAIL_PROVIDER: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies (Reproducible)
        run: npm ci

      - name: Dependency security check
        run: npm audit --omit=dev --audit-level=high || true

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace apps/api

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck Applications
        run: npm run typecheck

      - name: Run Unit Tests (API & Web)
        run: npm run test:unit

      - name: Apply Database Migrations (PostgreSQL)
        run: npm run db:deploy

      - name: Seed Database (PostgreSQL)
        run: npm run db:seed

      - name: Run E2E & Integration Tests (PostgreSQL)
        run: npm run test:e2e

      - name: Build Production Bundles (API & Web)
        run: npm run build

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: blynt-api:ci

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: blynt-web:ci
